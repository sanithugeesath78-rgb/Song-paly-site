<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Immersive Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Wallpaper Background */
        .wallpaper-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        #wallpaper {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.8);
        }

        /* Overlay for better text visibility */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.3), rgba(0,0,0,0.5));
            z-index: 0;
        }

        /* Content Container */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 20px rgba(0,0,0,0.8);
            animation: fadeInDown 1s ease-out;
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            text-shadow: 1px 1px 10px rgba(0,0,0,0.8);
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        /* Music Control Panel */
        .music-control {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: fadeInUp 1s ease-out 0.6s both;
            z-index: 100;
            pointer-events: auto;
        }

        .play-pause-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            pointer-events: auto;
            z-index: 101;
        }

        .play-pause-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .play-pause-btn:active {
            transform: scale(0.95);
        }

        .play-pause-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .song-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            color: white;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        .song-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .song-status {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        /* Upload Section */
        .upload-section {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 10;
            animation: fadeIn 1s ease-out 0.9s both;
        }

        .upload-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            margin: 5px;
            display: inline-block;
        }

        .upload-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        input[type="file"] {
            display: none;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }

            .music-control {
                padding: 15px 30px;
                bottom: 20px;
            }

            .upload-section {
                top: 15px;
                right: 15px;
            }

            .upload-btn {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
        }

        /* Loading indicator */
        .loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            z-index: 1000;
        }

        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Wallpaper Background -->
    <div class="wallpaper-container">
        <img id="wallpaper" src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=1920&q=80" alt="Default Wallpaper">
    </div>
    
    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Loading Indicator -->
    <div class="loading" id="loading">Loading...</div>

    <!-- Upload Section -->
    <div class="upload-section">
        <label for="wallpaper-upload" class="upload-btn">
            🖼️ Upload Wallpaper
        </label>
        <input type="file" id="wallpaper-upload" accept="image/*">
        
        <label for="music-upload" class="upload-btn">
            🎵 Upload Song
        </label>
        <input type="file" id="music-upload" accept="audio/*">
    </div>

    <!-- Main Content -->
    <div class="content">
        <h1>My Immersive Space</h1>
        <p class="subtitle">Upload your wallpaper and music to personalize</p>
    </div>

    <!-- Music Control Panel -->
    <div class="music-control">
        <button class="play-pause-btn" id="playPauseBtn">
            <svg id="playIcon" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="pauseIcon" style="display: none;" viewBox="0 0 24 24">
                <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
            </svg>
        </button>
        
        <div class="song-info">
            <div class="song-title" id="songTitle">No song loaded</div>
            <div class="song-status" id="songStatus">Upload a song to begin</div>
        </div>
    </div>

    <script>
        // Get elements
        const wallpaperUpload = document.getElementById('wallpaper-upload');
        const musicUpload = document.getElementById('music-upload');
        const wallpaperImg = document.getElementById('wallpaper');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const songTitle = document.getElementById('songTitle');
        const songStatus = document.getElementById('songStatus');
        const loading = document.getElementById('loading');

        // Web Audio API variables
        let audioContext;
        let audioBuffer;
        let sourceNode;
        let isPlaying = false;
        let startTime = 0;
        let pauseTime = 0;
        let currentFileName = '';

        // Initialize Audio Context
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                console.log('🎵 Audio Context initialized');
                console.log('Sample rate:', audioContext.sampleRate);
            }
        }

        // Wallpaper Upload Handler
        wallpaperUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                loading.classList.add('active');
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    wallpaperImg.src = event.target.result;
                    setTimeout(() => {
                        loading.classList.remove('active');
                    }, 500);
                };
                
                reader.readAsDataURL(file);
            }
        });

        // Music Upload Handler - Using Web Audio API
        musicUpload.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // Validate audio file
            if (!file.type.startsWith('audio/')) {
                alert('කරුණාකර audio file එකක් තෝරන්න! (MP3, WAV, OGG)');
                return;
            }
            
            loading.classList.add('active');
            songStatus.textContent = 'Loading...';
            
            // Stop any currently playing audio
            if (sourceNode) {
                try {
                    sourceNode.stop();
                } catch (e) {
                    console.log('Source already stopped');
                }
                sourceNode = null;
            }
            isPlaying = false;
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            
            try {
                // Initialize audio context
                initAudioContext();
                
                console.log('📁 Loading file:', file.name);
                console.log('📊 Size:', (file.size / 1024 / 1024).toFixed(2), 'MB');
                console.log('🎵 Type:', file.type);
                
                // Read file as ArrayBuffer
                const arrayBuffer = await file.arrayBuffer();
                console.log('✅ File read as ArrayBuffer');
                
                songStatus.textContent = 'Decoding audio...';
                
                // Decode audio data
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                console.log('🎶 Audio decoded successfully!');
                console.log('Duration:', audioBuffer.duration.toFixed(2), 'seconds');
                console.log('Channels:', audioBuffer.numberOfChannels);
                console.log('Sample rate:', audioBuffer.sampleRate);
                
                // Update UI
                currentFileName = file.name.replace(/\.[^/.]+$/, "");
                songTitle.textContent = currentFileName;
                songStatus.textContent = 'Ready to play ✓';
                loading.classList.remove('active');
                
                // Reset timing
                startTime = 0;
                pauseTime = 0;
                
            } catch (error) {
                console.error('❌ Error loading audio:', error);
                
                let errorMsg = 'Audio decode කරන්න බැහැ!';
                if (error.name === 'EncodingError') {
                    errorMsg = 'Audio format එක decode කරන්න බැහැ. MP3 හෝ WAV file එකක් try කරන්න!';
                } else if (error.name === 'NotSupportedError') {
                    errorMsg = 'Audio format එක support නෑ. වෙනත් file එකක් try කරන්න!';
                }
                
                alert('⚠️ ' + errorMsg + '\n\n' + error.message);
                songStatus.textContent = 'Error loading';
                loading.classList.remove('active');
                audioBuffer = null;
            }
        });

        // Play Audio Function
        function playAudio() {
            console.log('▶️▶️▶️ playAudio() function called');
            
            if (!audioBuffer) {
                console.log('❌ No audio buffer in playAudio');
                alert('කරුණාකර පළමුව ගීතයක් upload කරන්න! 🎵');
                return;
            }
            
            try {
                console.log('🔊 Audio context state:', audioContext.state);
                
                // Resume audio context if suspended
                if (audioContext.state === 'suspended') {
                    console.log('⚠️ Audio context suspended, resuming...');
                    audioContext.resume().then(() => {
                        console.log('✅ Audio context resumed');
                    });
                }
                
                console.log('🎵 Creating source node...');
                // Create new source node
                sourceNode = audioContext.createBufferSource();
                sourceNode.buffer = audioBuffer;
                sourceNode.loop = true; // Loop the audio
                sourceNode.connect(audioContext.destination);
                
                console.log('✅ Source node created and connected');
                
                // Calculate offset if resuming from pause
                const offset = pauseTime % audioBuffer.duration;
                console.log('⏩ Starting from offset:', offset.toFixed(2), 'seconds');
                
                // Start playing
                sourceNode.start(0, offset);
                startTime = audioContext.currentTime - offset;
                
                console.log('🎶 Audio started playing!');
                console.log('Start time:', startTime);
                console.log('Current time:', audioContext.currentTime);
                
                // Update UI
                isPlaying = true;
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                songStatus.textContent = 'Now playing...';
                
                console.log('✅ UI updated - play icon hidden, pause icon shown');
                
                // Handle when audio ends (though it loops)
                sourceNode.onended = function() {
                    console.log('🔚 Source node ended');
                    if (isPlaying) {
                        console.log('🔄 Audio loop ended, restarting...');
                    }
                };
                
            } catch (error) {
                console.error('❌❌❌ Play error:', error);
                console.error('Error name:', error.name);
                console.error('Error message:', error.message);
                console.error('Error stack:', error.stack);
                alert('Play කරන්න දෝෂයක්!\n\n' + error.message);
                isPlaying = false;
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }

        // Pause Audio Function
        function pauseAudio() {
            if (sourceNode && isPlaying) {
                try {
                    // Calculate current position
                    pauseTime = (audioContext.currentTime - startTime) % audioBuffer.duration;
                    
                    // Stop the source
                    sourceNode.stop();
                    sourceNode = null;
                    
                    // Update UI
                    isPlaying = false;
                    playIcon.style.display = 'block';
                    pauseIcon.style.display = 'none';
                    songStatus.textContent = 'Paused';
                    
                    console.log('⏸️ Paused at:', pauseTime.toFixed(2), 'seconds');
                    
                } catch (error) {
                    console.error('❌ Pause error:', error);
                }
            }
        }

        // Play/Pause Button Handler
        playPauseBtn.addEventListener('click', function(event) {
            event.stopPropagation(); // Prevent event bubbling
            
            console.log('=================================');
            console.log('🖱️ Play button clicked!');
            console.log('Audio buffer loaded:', !!audioBuffer);
            console.log('Is playing:', isPlaying);
            console.log('Audio context state:', audioContext ? audioContext.state : 'not created');
            console.log('=================================');
            
            if (!audioBuffer) {
                console.log('❌ No audio buffer - showing alert');
                alert('කරුණාකර පළමුව ගීතයක් upload කරන්න! 🎵');
                return;
            }
            
            if (isPlaying) {
                console.log('⏸️ Calling pauseAudio()');
                pauseAudio();
            } else {
                console.log('▶️ Calling playAudio()');
                playAudio();
            }
        });

        // Log browser info
        console.log('🌐 Browser:', navigator.userAgent);
        console.log('🎵 Web Audio API support:', !!(window.AudioContext || window.webkitAudioContext));
        
        // Test button on page load
        setTimeout(() => {
            console.log('🧪 Testing button...');
            console.log('Button element:', playPauseBtn);
            console.log('Button visible:', playPauseBtn.offsetParent !== null);
            console.log('Button dimensions:', playPauseBtn.offsetWidth, 'x', playPauseBtn.offsetHeight);
            console.log('Button position:', playPauseBtn.getBoundingClientRect());
        }, 2000);
    </script>
</body>
</html>
